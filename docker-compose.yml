services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vantiq
      POSTGRES_USER: vantiq
      POSTGRES_PASSWORD: vantiq_local_only
    ports:
      - "5432:5432"
    volumes:
      - vantiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantiq -d vantiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  vantiq_pgdata:
