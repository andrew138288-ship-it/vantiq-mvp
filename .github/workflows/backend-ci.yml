name: Backend CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/react-whatsapp-dock]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vantiq
          POSTGRES_USER: vantiq
          POSTGRES_PASSWORD: vantiq_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantiq -d vantiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vantiq:vantiq_local_only@localhost:5432/vantiq
      APP_ENV: test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js for extension tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and generate React extension dependency lockfile
        working-directory: extension-react
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated React extension lockfile
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension-react/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(extension): lock React dock dependencies"
            TARGET_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:$TARGET_REF"
          fi
      - name: Install locked React extension dependencies
        working-directory: extension-react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and typecheck React extension
        working-directory: extension-react
        run: npm test
      - name: Build React WhatsApp dock
        working-directory: extension-react
        env:
          VITE_API_BASE: https://vantiq-mvp-production-97577cdb.up.railway.app
        run: npm run build
      - name: Package React WhatsApp dock
        run: python extension-react/package.py
      - name: Upload generated npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: vantiq-react-extension-lockfile
          path: extension-react/package-lock.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable React Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: vantiq-react-whatsapp-dock
          path: dist/VANTIQ-WhatsApp-Dock-0.2.0.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate extension JavaScript syntax
        run: |
          node --check extension/content.js
          node --check extension/service-worker.js
          node --check extension/sidepanel.js
          node --check extension/transcript.mjs
      - name: Run Chrome extension tests
        run: node --test extension/tests/*.test.mjs
      - name: Package Chrome extension
        run: python extension/package.py
      - name: Upload installable Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: vantiq-chrome-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend/app backend/migrations
      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Validate core schema and security
        working-directory: backend
        run: python -m pytest -q
      - name: API health check
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/vantiq-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vantiq-api.log
          exit 1
