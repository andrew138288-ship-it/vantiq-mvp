<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VANTIQ</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">WORLD-CLASS SALES AI</p>
        <h1>VANTIQ</h1>

      <section class="notice">

      <section>
        <h2>Backend connection</h2>
        <button id="health-check" type="button">Check backend</button>
        <p id="status" role="status">Not checked yet</p>
      </section>
      <footer>Locale support includes separate pt-BR and pt-PT variants.</footer>
    </main>
    <script src="sidepanel.js"></script>
